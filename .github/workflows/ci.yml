name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor of `requires-python` and a current release. A break on only one of
        # the two is the interesting signal, so the matrix does not fail fast.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Also the M0 invariant: a clean clone must be installable as-is.
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # The proxy is the entry point; an import-time break would not show up above.
      - name: CLI smoke
        run: exodus --help
